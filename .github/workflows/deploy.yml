name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Through the season the orchard pages state what is usually ripe "as of"
  # their build date, so a build that is a month old is a page that is a month
  # wrong. Rebuilding nightly keeps the crawlable HTML honest; the map page
  # computes the same thing in the browser and is always current.
  schedule:
    - cron: '17 9 * 8,9,10,11 *'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps a version number counted from the commit history.
          # actions/checkout is shallow by default, which would make that
          # number 1 on every deploy forever — worse than no version at all,
          # because it looks like one and never changes.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build
        env:
          # Project sites serve from /<repo>/. Derived so a fork or a rename
          # does not silently ship a bundle with the wrong asset paths.
          BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
