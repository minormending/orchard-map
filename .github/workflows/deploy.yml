name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Through the season the orchard pages state what is usually ripe "as of"
  # their build date, so a build that is a month old is a page that is a month
  # wrong. Rebuilding nightly keeps the crawlable HTML honest; the map page
  # computes the same thing in the browser and is always current.
  schedule:
    - cron: '17 9 * 8,9,10,11 *'

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages has documented this as required since v4, which fetches the
  # artifact by ID through the Actions API rather than being handed it. Deploys
  # have succeeded without it the whole time — so this is closing a gap between
  # what the workflow asks for and what the action says it needs, not fixing a
  # break. Worth doing because the failure it prevents would arrive on some
  # future runner change with no commit of ours to blame it on.
  #
  # Declaring the block at all is what made this possible to get wrong: a
  # workflow with no `permissions:` gets the repository default, and naming
  # three scopes silently revokes every scope not named.
  actions: read

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned ahead of the migration rather than waiting for it: `ubuntu-latest`
    # becomes 26.04 between 19 October and 19 November 2026, and a version that
    # changes under a deploy is a version that breaks it on a day nobody chose.
    # Moving first means any breakage lands on a commit that explains itself.
    #
    # The cost is that this no longer follows `latest`, so the next LTS needs an
    # edit here. That is the trade: known staleness over a surprise. Worth
    # returning to `ubuntu-latest` once the migration completes, if floating is
    # preferred — the label will point at this same image by then.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamps a version number counted from the commit history.
          # actions/checkout is shallow by default, which would make that
          # number 1 on every deploy forever — worse than no version at all,
          # because it looks like one and never changes.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build
        env:
          # Project sites serve from /<repo>/. Derived so a fork or a rename
          # does not silently ship a bundle with the wrong asset paths.
          BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - uses: actions/configure-pages@v6

      # Since v4 this drops dotfiles from the artifact without saying so.
      # `dist` has none today and Pages runs no Jekyll, so nothing here wants a
      # `.nojekyll` — but anything dot-prefixed added to `public/` later will
      # build locally and silently not deploy. `include-hidden-files: true` is
      # the way back if that day comes.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
